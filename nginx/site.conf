# Nginx dentro do contêiner. HTTP -> HTTPS e certificado ficam com o Easypanel (Traefik).
# Atenção: no Nginx, um add_header dentro de location apaga os do bloco server. Por isso os cabeçalhos
# de segurança ficam no snippet seguranca.conf, incluído no server e em cada location que tem add_header.
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/plain text/css text/xml application/javascript application/json text/markdown;
    server_tokens off;

    # Atrás do proxy, os redirecionamentos ficam relativos (mantêm https e o domínio)
    absolute_redirect off;

    # www -> sem www (domínio canônico: https://guincho24honline.com.br)
    if ($host = www.guincho24honline.com.br) {
        return 301 https://guincho24honline.com.br$request_uri;
    }

    # /pagina/index.html -> /pagina/ (uma URL por página)
    if ($request_uri ~ "^(.*/)index\.html(\?.*)?$") {
        return 301 $1$2;
    }

    # 301 e 410 do site antigo
    include /etc/nginx/snippets/guincho24honline-301.conf;

    location / {
        try_files $uri $uri/ =404;
    }

    # Pedidos dos pop-ups: vão para o api/lead.mjs, que manda o e-mail pelo Resend
    location = /api/lead {
        limit_except POST { deny all; }
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/snippets/seguranca.conf;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex" always;
    }
    location = /api/saude { proxy_pass http://127.0.0.1:3000; }
    # Planilha de leads (usuário leads, senha LEAD_ADMIN; sem log de acesso)
    location = /api/leads.csv { access_log off; limit_except GET { deny all; } proxy_pass http://127.0.0.1:3000; include /etc/nginx/snippets/seguranca.conf; add_header Cache-Control "no-store" always; add_header X-Robots-Tag "noindex" always; }

    # Página própria (útil) para 404 e 410, mantendo o código de status
    error_page 404 410 /404.html;
    location = /404.html { internal; include /etc/nginx/snippets/seguranca.conf; add_header Cache-Control "no-cache" always; }

    location ~* \.html$ { include /etc/nginx/snippets/seguranca.conf; add_header Cache-Control "no-cache" always; }
    location /assets/ { expires 30d; include /etc/nginx/snippets/seguranca.conf; add_header Cache-Control "public, max-age=2592000" always; }

    gzip on;
    gzip_comp_level 9;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/xml text/plain text/markdown application/json application/ld+json;

    include /etc/nginx/snippets/seguranca.conf;

    location ~ /\.(?!well-known) { deny all; }
}
