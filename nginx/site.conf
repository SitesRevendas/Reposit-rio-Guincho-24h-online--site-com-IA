# Nginx dentro do contêiner. HTTP -> HTTPS e certificado ficam com o Easypanel (Traefik).
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Atrás do proxy, os redirecionamentos ficam relativos (mantêm https e o domínio)
    absolute_redirect off;

    # www -> sem www (domínio canônico: https://guincho24honline.com.br)
    if ($host = www.guincho24honline.com.br) {
        return 301 https://guincho24honline.com.br$request_uri;
    }

    # 301 e 410 do site antigo
    include /etc/nginx/snippets/guincho24honline-301.conf;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    location ~* \.html$ { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options "nosniff" always; }
    location /assets/ { expires 30d; add_header Cache-Control "public, max-age=2592000" always; }

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location ~ /\.(?!well-known) { deny all; }
}
